steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/deliver-mee-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/deliver-mee-backend:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/deliver-mee-backend:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'deliver-mee-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/deliver-mee-backend:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '3600'
      - '--max-instances'
      - '100'
      - '--set-env-vars'
      - 'USE_FIREBASE_DB=true,GCP_PROJECT=delivermee-12c26,GOOGLE_APPLICATION_CREDENTIALS=/app/service_account_key.json,FLASK_DEBUG=False'

images:
  - 'gcr.io/$PROJECT_ID/deliver-mee-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/deliver-mee-backend:latest'

substitutions:
  _REGION: 'us-central1'

options:
  machineType: 'N1_HIGHCPU_8'

timeout: '2400s'
